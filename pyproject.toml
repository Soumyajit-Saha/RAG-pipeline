    { name = "Soumyajit Saha", email = "u1320949@umail.utah.edu" }
]
requires-python = ">=3.10"
dependencies = [
    "bs4>=0.0.2",
    "chromadb>=1.5.9",
    "langchain>=1.4.7",
    "langchain-anthropic>=0.3.22",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
